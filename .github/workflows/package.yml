name: Package
# A version tag builds the four downloads and attaches them, each with its checksum, to that release.
# Run by hand, it builds the signed Android app alone (or, with phone_only off, the downloads too)
# and publishes nothing: the release job runs for a version tag only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      phone_only:
        description: Build only the signed Android app
        type: boolean
        default: true
# Only the job that attaches the downloads may write. The gate reads Actions history so a tag cannot
# publish a commit unless that exact commit passed either the exhaustive lane or the fail-closed fast lane.
permissions:
  actions: read
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to match this package and descend from integration
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-lineage.mjs --version "$TAG"
          git fetch origin refs/heads/mac/cross-platform:refs/remotes/origin/mac/cross-platform
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/mac/cross-platform; then
            echo "::error::The tagged commit is not in the integration branch; refusing to publish it."
            exit 1
          fi
      - name: Require successful CI for this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 100); do
            runs="$(gh api --method GET "repos/$GH_REPO/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=100)"
            if printf '%s' "$runs" | node scripts/release-lineage.mjs "$GITHUB_SHA" "$GH_REPO"; then
              exit 0
            fi
            waiting="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" --arg repo "$GH_REPO" \
              '[.workflow_runs[] | select(.path == ".github/workflows/checks.yml" and .head_sha == $sha and .head_branch == "mac/cross-platform" and .repository.full_name == $repo and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch") and .status != "completed")] | length')"
            if [ "$waiting" -eq 0 ] && [ "$attempt" -ge 3 ]; then
              echo "::error::No successful trusted integration Checks run for this exact commit. Nothing will be built or published."
              exit 1
            fi
            echo "Trusted exact-commit integration Checks are not green yet; waiting ($attempt/100)."
            sleep 30
          done
          echo "::error::No successful exact-commit CI result within 50 minutes. Nothing will be built or published."
          exit 1
  # The Android app is built and signed once per release, and that one APK goes into every desktop
  # download (in phone/), so "Get Branch on your phone" can hand it to a phone. Without the signing
  # secrets (a fork) this job does nothing and the downloads say the phone app is not included yet.
  android:
    needs: release-gate
    runs-on: ubuntu-latest
    env:
      BRANCH_MOBILE_BUILD: '1'
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      # The certificate every Branch APK has been signed with. A phone only updates an installed app
      # from an APK with the same certificate, so any other key is refused here, before it ships.
      ANDROID_CERT_SHA256: 78ec3b2816557ae4df6222dd27f7abdb4746eea42464ad40ae7b34c6ef04bb76
    outputs:
      built: ${{ steps.phone-app.outputs.built }}
    steps:
      - name: Say the downloads will not include the phone app
        if: env.HAS_ANDROID_KEY != 'true'
        run: echo "::warning::There is no Android signing key (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD), so these downloads will not include the phone app."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_ANDROID_KEY == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Use the runner's Java 21 (Capacitor 8 needs it)
        if: env.HAS_ANDROID_KEY == 'true'
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - if: env.HAS_ANDROID_KEY == 'true'
        run: npm ci --no-audit --no-fund
      - if: env.HAS_ANDROID_KEY == 'true'
        run: npm run build
      - if: env.HAS_ANDROID_KEY == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      # The key is written to this run's own temporary folder, readable by the runner's user only,
      # and removed at the end whatever happens. It is never printed.
      - name: Load the Android signing key
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/branch-agent.jks"
          echo "BRANCH_ANDROID_KEYSTORE=$RUNNER_TEMP/branch-agent.jks" >> "$GITHUB_ENV"
      - name: Build and sign the Android app
        id: phone-app
        if: env.HAS_ANDROID_KEY == 'true'
        env:
          BRANCH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          node scripts/package-mobile.mjs --android
          apk=release/mobile/Branch-Agent-android.apk
          (cd release/mobile && sha256sum --check Branch-Agent-android.apk.sha256)
          signer="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$signer/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/android-certs.txt"
          # apksigner labels the line by version ("Signer #1" or "V2 Signer"), so only the digests are read.
          digests="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-certs.txt" | sort -u)"
          echo "Signed with certificate SHA-256 $digests"
          if [ "$digests" != "$ANDROID_CERT_SHA256" ]; then
            echo "::error::The Android app is not signed with Branch's own certificate, so installed phones could not update to it."
            exit 1
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Remove the Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/branch-agent.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.phone-app.outputs.built == 'true'
        with:
          name: phone-app
          path: |
            release/mobile/Branch-Agent-android.apk
            release/mobile/Branch-Agent-android.apk.sha256
          if-no-files-found: error
          retention-days: 7
  build:
    needs: [release-gate, android]
    if: github.event_name == 'push' || !inputs.phone_only
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      # Both halves are needed: the .p12 puts the key on the runner, the SHA-1 is what the build
      # names it by. Either one alone signs nothing and silently falls back to the ad-hoc seal.
      HAS_MAC_SIGNING_CERTIFICATE: ${{ secrets.MAC_SIGNING_P12_BASE64 != '' && secrets.MAC_SIGNING_SHA1 != '' }}
      HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      # The owner's switch. Until it is set, the Mac copy is unsigned exactly as it always was, with a
      # warning. Once it is set, a missing or broken certificate refuses the release instead of
      # silently shipping a build that resets every user's permissions.
      MAC_SIGNING_REQUIRED: ${{ vars.MAC_SIGNING_REQUIRED == 'true' }}
      HAS_ANY_MAC_SIGNING_SECRET: ${{ secrets.MAC_SIGNING_P12_BASE64 != '' || secrets.MAC_SIGNING_P12_PASSWORD != '' || secrets.MAC_SIGNING_SHA1 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The one signed Android app, where scripts/package-desktop.mjs copies it into phone/ from.
      - name: Fetch the phone app
        if: needs.android.outputs.built == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phone-app
          path: release/mobile
      # Signing on the Mac only happens when the repository has the certificate; otherwise the
      # download is unsigned and macOS warns the first time it is opened.
      - if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      # The free certificate that keeps the owner's microphone, screen and accessibility permissions
      # across updates. Without it the Mac copy falls back to the ad-hoc seal, whose identity is the
      # app's own contents, so the next update looks like a different app and every permission is
      # asked for again. Once signing is switched on that failure would be silent, so it refuses.
      - name: Refuse to publish a Mac release with no signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED == 'true' && env.HAS_MAC_SIGNING_CERTIFICATE != 'true' && !(env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_APPLE_SIGNING_IDENTITY == 'true')
        run: |
          echo "::error::Mac signing is switched on (MAC_SIGNING_REQUIRED) but there is no signing certificate." \
            "Publishing now would reset every user's microphone, screen recording and accessibility permission." \
            "Set MAC_SIGNING_P12_BASE64, MAC_SIGNING_P12_PASSWORD and MAC_SIGNING_SHA1 (scripts/make-mac-signing-certificate.sh)."
          exit 1
      # A signing secret with no switch is almost certainly a setup that was never finished.
      - name: Refuse a half-finished Mac signing setup
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED != 'true' && env.HAS_ANY_MAC_SIGNING_SECRET == 'true'
        run: |
          echo "::error::A MAC_SIGNING_* secret is set but the repository variable MAC_SIGNING_REQUIRED is not 'true'." \
            "Finish turning signing on (docs/desktop.md), or remove the secrets."
          exit 1
      - name: Warn that the Mac copy is unsigned
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED != 'true' && env.HAS_ANY_MAC_SIGNING_SECRET != 'true'
        run: |
          message="The Mac copy in this release is unsigned: every update will ask each person for microphone, screen recording and accessibility permission again. To stop that, turn signing on (docs/desktop.md)."
          echo "::warning::$message"
          printf '### macOS download is unsigned\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
      # The certificate lives in a keychain made for this run only. It is never trusted: an untrusted
      # certificate signs perfectly well when it is named by its SHA-1, and trusting it would be a
      # change to the machine's security settings for no gain. The keychain must be added to the
      # search list: codesign's own --keychain is not enough to find the identity by SHA-1, and it
      # fails with "no identity found" without this line. It is added beside the keychains already
      # there, never in place of them.
      - name: Load the signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING_CERTIFICATE == 'true'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/branch-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MAC_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/branch-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/branch-signing.p12" -k "$keychain" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -f pkcs12 >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d ' "')
          rm -f "$RUNNER_TEMP/branch-signing.p12"
          echo "MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
      - name: Build the download
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_SIGNING_SHA1: ${{ secrets.MAC_SIGNING_SHA1 }}
          MAC_SIGNING_REQUIRED: ${{ env.MAC_SIGNING_REQUIRED }}
        run: |
          if [ -f "$RUNNER_TEMP/notary-key.p8" ]; then export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"; fi
          npm run package:desktop -- --release
          if [ "$RUNNER_OS" = "macOS" ]; then node scripts/package-desktop.mjs --release --arch x64; fi
      - name: Remove the signing material
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/branch-signing.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          if [ -f "$RUNNER_TEMP/branch-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/branch-signing.keychain-db"; fi
      # The phone download: the packed command the Termux script installs, with the checksum that
      # script insists on. Built on Linux only, so the three runners cannot produce three of it.
      - name: Build the phone download
        if: runner.os == 'Linux'
        shell: bash
        working-directory: release
        run: |
          node ../scripts/pack-cli.mjs . >/dev/null
          test "$(ls -1 branch-agent-*.tgz | wc -l)" -eq 1
          name="$(ls -1 branch-agent-*.tgz)"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: download-phone
          path: |
            release/branch-agent-*.tgz
            release/branch-agent-*.tgz.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-${{ runner.os }}
          path: |
            release/Branch-Agent-*.zip
            release/Branch-Agent-*.tar.gz
            release/Branch-Agent-*.sha256
            release/Install Branch Agent.cmd
            release/install-branch-agent.sh
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [release-gate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads
          merge-multiple: true
      - name: Check every download is there with its checksum
        working-directory: downloads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for name in Branch-Agent-windows-x64.zip Branch-Agent-macos-arm64.zip Branch-Agent-macos-x64.zip Branch-Agent-linux-x64.tar.gz; do
            test -f "$name" && test -f "$name.sha256"
            sha256sum --check "$name.sha256"
          done
          test -f "Install Branch Agent.cmd" && test -f install-branch-agent.sh
          # The phone download is named after the version in package.json, so a tag that does not
          # match it stops the release here rather than shipping a file the script cannot check.
          cli="branch-agent-${TAG#v}.tgz"
          test -f "$cli" && test -f "$cli.sha256"
          sha256sum --check "$cli.sha256"
      # Assets are attached to a draft first. Only after a second inventory proves every archive,
      # checksum and installer is present does the script publish it as the latest release.
      - name: Publish the complete reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node source/scripts/publish-release.mjs \
            --tag "$TAG" --repo "$GH_REPO" --downloads downloads --source source
