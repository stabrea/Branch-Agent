name: Package
# A version tag builds the four downloads and attaches them, each with its checksum, to that release.
on:
  push:
    tags: ['v*']
# Only the job that attaches the downloads may write; the builds (which run npm ci) may only read.
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Signing on the Mac only happens when the repository has the certificate; otherwise the
      # download is unsigned and macOS warns the first time it is opened.
      - if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - if: runner.os == 'macOS' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
      - name: Build the download
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -f "$RUNNER_TEMP/notary-key.p8" ]; then export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"; fi
          npm run package:desktop -- --release
          if [ "$RUNNER_OS" = "macOS" ]; then node scripts/package-desktop.mjs --release --arch x64; fi
      - name: Remove the signing material
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
      # The phone download: the packed command the Termux script installs, with the checksum that
      # script insists on. Built on Linux only, so the three runners cannot produce three of it.
      - name: Build the phone download
        if: runner.os == 'Linux'
        shell: bash
        working-directory: release
        run: |
          node ../scripts/pack-cli.mjs . >/dev/null
          test "$(ls -1 branch-agent-*.tgz | wc -l)" -eq 1
          name="$(ls -1 branch-agent-*.tgz)"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: download-phone
          path: |
            release/branch-agent-*.tgz
            release/branch-agent-*.tgz.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-${{ runner.os }}
          path: |
            release/Branch-Agent-*.zip
            release/Branch-Agent-*.tar.gz
            release/Branch-Agent-*.sha256
            release/Install Branch Agent.cmd
            release/install-branch-agent.sh
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloads
          merge-multiple: true
      - name: Check every download is there with its checksum
        working-directory: downloads
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for name in Branch-Agent-windows-x64.zip Branch-Agent-macos-arm64.zip Branch-Agent-macos-x64.zip Branch-Agent-linux-x64.tar.gz; do
            test -f "$name" && test -f "$name.sha256"
            sha256sum --check "$name.sha256"
          done
          test -f "Install Branch Agent.cmd" && test -f install-branch-agent.sh
          # The phone download is named after the version in package.json, so a tag that does not
          # match it stops the release here rather than shipping a file the script cannot check.
          cli="branch-agent-${TAG#v}.tgz"
          test -f "$cli" && test -f "$cli.sha256"
          sha256sum --check "$cli.sha256"
      # A download already on the release is never replaced: an owner may have attached a hand-built
      # one (the Windows zip once was), and it stays together with its own checksum.
      - name: Attach to the release, keeping anything already there
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: downloads
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Branch Agent ${TAG#v}" --notes "Downloads for ${TAG}."
          attached="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          on_release() { printf '%s\n' "$attached" | grep -Fxq -- "$1"; }
          for name in Branch-Agent-windows-x64.zip Branch-Agent-macos-arm64.zip Branch-Agent-macos-x64.zip Branch-Agent-linux-x64.tar.gz; do
            if on_release "$name"; then
              echo "$name is already on the release; it and its checksum are kept as they are."
              on_release "$name.sha256" || echo "::warning::$name is on the release without $name.sha256; attach its checksum by hand."
            else
              gh release upload "$TAG" "$name" "$name.sha256"
            fi
          done
          cli="branch-agent-${TAG#v}.tgz"
          if on_release "$cli"; then
            echo "$cli is already on the release; it and its checksum are kept as they are."
            on_release "$cli.sha256" || echo "::warning::$cli is on the release without $cli.sha256; attach its checksum by hand."
          else
            gh release upload "$TAG" "$cli" "$cli.sha256"
          fi
          for script in "Install Branch Agent.cmd" install-branch-agent.sh; do
            if on_release "$script"; then echo "$script is already on the release; it is kept."; else gh release upload "$TAG" "$script"; fi
          done
