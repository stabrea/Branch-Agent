name: Checks
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      # Linux has no screen on the runner; Electron tests draw into a virtual one.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - if: runner.os != 'Linux'
        run: npm test
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: npm run demo
      # Packaging is Windows-only until the macOS and Linux downloads land (M1).
      - if: runner.os == 'Windows'
        run: npm run package:desktop
