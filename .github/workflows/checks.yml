name: Checks
# Two faults, one rule. Pushing every branch at once once started a run on all 216 of them,
# including agent worktree branches from months ago that were never meant to build: six failed in
# the same minute for reasons that had nothing to do with anyone's work, and the queue they made
# delayed the release that did. And a branch with a pull request was being checked twice, on the
# push and again on the request, which on a shared runner is slow enough to fail tests that wait on
# a clock.
#
# So: a push builds only the branches nobody opens a request for, and everything with a request is
# checked by the request, which is the real gate into main.
on:
  push:
    branches: [main, wave2/integration, 'release/**', 'mac/**', 'mac2/**', 'mac5/**', 'mac6/**', 'mac7/**', 'wave9/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run per branch. A newer push replaces an older run rather than queueing behind it, except on
# main, where every commit's result is worth keeping.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Where the time went (run 35382268151, before this change): Windows took 70.7 minutes, and 63 of
# them were the test files running three at a time on one machine; macOS and Linux did the same in
# about 20. So the tests are split into shares that run on separate machines at once (`--shard`,
# packed by measured time from tests/test-weights.json), and the packaging runs beside them rather
# than after them. Nothing is skipped: every share of every system runs on every push and every pull
# request, and `verify` is red unless all of them and every packaging job are green.
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, total: 6 }
          - { os: windows-latest, shard: 2, total: 6 }
          - { os: windows-latest, shard: 3, total: 6 }
          - { os: windows-latest, shard: 4, total: 6 }
          - { os: windows-latest, shard: 5, total: 6 }
          - { os: windows-latest, shard: 6, total: 6 }
          - { os: macos-latest, shard: 1, total: 2 }
          - { os: macos-latest, shard: 2, total: 2 }
          - { os: ubuntu-latest, shard: 1, total: 2 }
          - { os: ubuntu-latest, shard: 2, total: 2 }
    runs-on: ${{ matrix.os }}
    # A share takes under 20 minutes. A test that leaves a process behind once kept a share waiting
    # 78 minutes for a file that would never finish; the default limit is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # '24' is the newest Node 24, which is above the floor in src/node-floor.ts (24.14.0). The
      # floor itself is held by a test in tests/comfort.test.mjs, not by pinning a patch here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Downloading the browser took 3.2 minutes of every Windows run. The download is kept between
      # runs, keyed on the Playwright version in the lockfile and on what is installed, so a new
      # version or a different browser starts a new copy. The install still runs every time: with the
      # browser already there it only checks it (Playwright marks a copy complete only once the whole
      # download landed, so a partial one is fetched again rather than used), and on Linux it also
      # puts in the system libraries, which are not in the kept folder. Nothing is restored from an
      # older key, so a copy from another version is never used.
      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - run: npx playwright install --with-deps chromium --only-shell
      # Ubuntu 24.04 turns off unprivileged user namespaces, which is what Electron's own sandbox is
      # built on, so every desktop test died with "Process failed to launch!" before reaching a
      # single assertion. This relaxes it on the build machine only. The app is not changed: the
      # alternative going around is passing --no-sandbox to Electron, which would mean shipping a
      # weaker sandbox to everyone in order to make a test pass here.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Linux has no screen on the runner; Electron tests draw into a virtual one.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          BRANCH_TEST_TIMINGS: ${{ runner.temp }}/test-timings.json
      - if: runner.os != 'Linux'
        run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          BRANCH_TEST_TIMINGS: ${{ runner.temp }}/test-timings.json
      # How long each file took, so tests/test-weights.json can be refreshed from a real run.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ runner.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings.json
          if-no-files-found: ignore
          retention-days: 14
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: npm run demo
      # Every system builds its download; Macs also build the Intel copy from the same runner.
      - run: npm run package:desktop -- --release
      - if: runner.os == 'macOS'
        run: node scripts/package-desktop.mjs --release --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-${{ runner.os }}
          path: |
            release/Branch-Agent-*.zip
            release/Branch-Agent-*.tar.gz
            release/Branch-Agent-*.sha256
            release/Install Branch Agent.cmd
          if-no-files-found: error
          retention-days: 7
  # The one check to wait for, and the name to require if main is protected (it is not today). It runs even when a
  # share fails, so the check is red rather than skipped, and it is green only when every share on
  # every system and every packaging job passed.
  verify:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every share and every package passed
        env:
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "tests: $TEST, packaging: $PACKAGE"
          test "$TEST" = success && test "$PACKAGE" = success
