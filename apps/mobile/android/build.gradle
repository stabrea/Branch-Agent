// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        if (project.hasProperty('branchPush')) classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // BRANCH_GRADLE_BUILD_DIR puts every project's build output outside the checkout (a build drive).
    def outside = System.getenv('BRANCH_GRADLE_BUILD_DIR')
    if (outside) layout.buildDirectory = new File(outside, project.name)
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
